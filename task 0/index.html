<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 0 - Contact Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="./index.html">Assignment 4</a>
        <div class="navbar-nav flex-row flex-wrap">
            <a class="nav-link px-2" href="../task 0/index.html">Task 0</a>
            <a class="nav-link px-2" href="../task 1/index.html">Task 1</a>
            <a class="nav-link px-2" href="../task 2/index.html">Task 2</a>
            <a class="nav-link px-2" href="../task 3/index.html">Task 3</a>
            <a class="nav-link px-2" href="../task 4/index.html">Task 4</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="form-box">
        <h1 class="mb-2">Contact Form</h1>
        <p class="text-muted mb-4">Fill in the form below to send a message.</p>
        <form>
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="Enter your name">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email">
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" name="message" class="form-control" rows="4" placeholder="Write your message"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</main>
</body>
</html>
