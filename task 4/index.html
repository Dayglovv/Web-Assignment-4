<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">    <link rel="stylesheet" href="../style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <div class="navbar-nav flex-row flex-wrap">
            <a class="nav-link px-2" href="../task 0/index.html">Task 0</a>
            <a class="nav-link px-2" href="../task 1/index.html">Task 1</a>
            <a class="nav-link px-2" href="../task 2/index.html">Task 2</a>
            <a class="nav-link px-2" href="../task 3/index.html">Task 3</a>
            <a class="nav-link px-2" href="../task 4/index.html">Task 4</a>
        </div>
    </div>
</nav>
<main class="container py-5">
    <div class="form-box">
        <h1>Registration Form</h1>
<form class="needs-validation" novalidate>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="firstName" class="form-label">First Name</label>
            <input type="text" id="firstName" class="form-control" required>
            <div class="invalid-feedback">Please enter your first name.</div>
        </div>
        <div class="col-md-6 mb-3">
            <label for="lastName" class="form-label">Last Name</label>
            <input type="text" id="lastName" class="form-control" required>
            <div class="invalid-feedback">Please enter your last name.</div>
        </div>
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" required>
        <div class="invalid-feedback">Please enter a valid email.</div>
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-control" required minlength="8">
            <div class="invalid-feedback">Password must have at least 8 characters.</div>
        </div>
        <div class="col-md-6 mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" id="confirmPassword" class="form-control" required minlength="8">
            <div class="invalid-feedback">Please enter the same password.</div>
        </div>
    </div>
    <div class="mb-3">
        <p class="mb-2">Gender</p>
        <div class="form-check form-check-inline">
            <input type="radio" id="male" name="gender" class="form-check-input" required>
            <label for="male" class="form-check-label">Male</label>
        </div>
        <div class="form-check form-check-inline">
            <input type="radio" id="female" name="gender" class="form-check-input" required>
            <label for="female" class="form-check-label">Female</label>
        </div>
        <div class="form-check form-check-inline">
            <input type="radio" id="other" name="gender" class="form-check-input" required>
            <label for="other" class="form-check-label">Other</label>
        </div>
    </div>
    <div class="mb-3">
        <p class="mb-2">Hobbies</p>
        <div class="form-check">
            <input type="checkbox" id="music" class="form-check-input">
            <label for="music" class="form-check-label">Music</label>
        </div>
        <div class="form-check">
            <input type="checkbox" id="gaming" class="form-check-input">
            <label for="gaming" class="form-check-label">Gaming</label>
        </div>
        <div class="form-check">
            <input type="checkbox" id="sports" class="form-check-input">
            <label for="sports" class="form-check-label">Sports</label>
        </div>
    </div>
    <div class="mb-3">
        <label for="country" class="form-label">Country</label>
        <select id="country" class="form-select" required>
            <option value="">Choose your country</option>
            <option>Kazakhstan</option>
            <option>Uzbekistan</option>
            <option>Kyrgyzstan</option>
            <option>Other</option>
        </select>
        <div class="invalid-feedback">Please choose a country.</div>
    </div>
    <button type="submit" class="btn btn-primary">Register</button>
    <button type="reset" class="btn btn-secondary">Reset</button>
</form>
    </div>
</main>
<script src="../script.js"></script>
</body>
</html>
