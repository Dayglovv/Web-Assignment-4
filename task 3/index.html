<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">    <link rel="stylesheet" href="../style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <div class="navbar-nav flex-row flex-wrap">
            <a class="nav-link px-2" href="../task 0/index.html">Task 0</a>
            <a class="nav-link px-2" href="../task 1/index.html">Task 1</a>
            <a class="nav-link px-2" href="../task 2/index.html">Task 2</a>
            <a class="nav-link px-2" href="../task 3/index.html">Task 3</a>
            <a class="nav-link px-2" href="../task 4/index.html">Task 4</a>
        </div>
    </div>
</nav>
<main class="container py-5">
    <div class="form-box">
        <h1>Contact Form with Feedback</h1>
<form class="needs-validation" novalidate>
    <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" class="form-control" required minlength="3">
        <div class="invalid-feedback">Please enter your name (at least 3 characters).</div>
        <div class="valid-feedback">Looks good!</div>
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" required>
        <div class="invalid-feedback">Please enter a valid email.</div>
        <div class="valid-feedback">Looks good!</div>
    </div>
    <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea id="message" class="form-control" required maxlength="500"></textarea>
        <div class="invalid-feedback">Please write a message.</div>
        <div class="valid-feedback">Thanks for your message!</div>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
</form>
    </div>
</main>
<script src="../script.js"></script>
</body>
</html>
